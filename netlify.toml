[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: every path must fall back to index.html so deep links and
# refreshes on /about, /projects etc. don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
