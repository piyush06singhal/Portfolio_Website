    <title>Piyush Singhal — Computer Science Engineering Student & Developer</title>

    <!-- Open Graph / social sharing.
         NOTE: og:url and og:image should be absolute URLs once deployed,
         e.g. https://your-domain.com/... — relative paths are ignored by
         some scrapers (LinkedIn in particular). -->
    <meta property="og:type" content="website" />

      property="og:title"
      content="Piyush Singhal — Computer Science Engineering Student & Developer"
    />

      property="og:description"
      content="Portfolio of Piyush Singhal, a Computer Science Engineering student and software developer building AI, full-stack and web applications."
    />
    <meta
      property="og:image"
      content="/og-image.jpg"
    />

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:title"
      content="Piyush Singhal — Computer Science Engineering Student & Developer"
    />

      name="twitter:description"
      content="Portfolio of Piyush Singhal, a Computer Science Engineering student and software developer building AI, full-stack and web applications."
    />

      name="twitter:image"
      content="/og-image.jpg"
